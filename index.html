<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>림버스 컴퍼니 인격 수집 트래커</title>
<link rel="stylesheet" href="style.css?v=202609281800">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">LIMBUS<br>COMPANY</div>
    <div>
      <h1>인격 수집 트래커</h1>
      <div class="sub" id="asof">데이터 불러오는 중…</div>
    </div>
  </div>
  <div class="top-right">
    <label class="thread">끈 <input type="number" id="thread" min="0"></label>
    <button id="btnReset" class="ghost" title="보유 체크/파편 입력을 스크린샷 기준 기본값으로 되돌립니다">기본값 복원</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div id="deckView" class="view"></div>
  <div id="builderView" class="view"></div>
  <div id="saeongView" class="view"></div>
  <section id="summary" class="panel"></section>

  <section class="panel filters">
    <div class="fgroup"><span class="flabel">보유</span>
      <button data-f="own" data-v="all" class="chip on">전체</button>
      <button data-f="own" data-v="owned" class="chip">보유</button>
      <button data-f="own" data-v="unowned" class="chip">미보유</button>
    </div>
    <div class="fgroup"><span class="flabel">등급</span>
      <button data-f="rar" data-v="3" class="chip on">000</button>
      <button data-f="rar" data-v="2" class="chip on">00</button>
      <button data-f="rar" data-v="1" class="chip on">0</button>
    </div>
    <div class="fgroup"><span class="flabel">구분</span>
      <button data-f="kind" data-v="all" class="chip on">전체</button>
      <button data-f="kind" data-v="pool" class="chip">상시 추출 풀</button>
      <button data-f="kind" data-v="limited" class="chip">한정/이벤트</button>
      <button data-f="kind" data-v="walpurgis" class="chip">발푸르기스</button>
    </div>
    <div class="fgroup"><span class="flabel">키워드</span>
      <button data-f="kw" data-v="all" class="chip on">전체</button>
      <button data-f="kw" data-v="화상" class="chip">화상</button>
      <button data-f="kw" data-v="출혈" class="chip">출혈</button>
      <button data-f="kw" data-v="진동" class="chip">진동</button>
      <button data-f="kw" data-v="파열" class="chip">파열</button>
      <button data-f="kw" data-v="침잠" class="chip">침잠</button>
      <button data-f="kw" data-v="호흡" class="chip">호흡</button>
      <button data-f="kw" data-v="충전" class="chip">충전</button>
      <button data-f="kw" data-v="none" class="chip" title="나무위키 목록에 상태이상 키워드 아이콘이 없는 인격">범용</button>
    </div>
    <div class="fgroup">
      <button data-f="craft" data-v="1" class="chip toggle">지금 교환 가능만</button>
      <input type="search" id="q" placeholder="인격 이름 검색">
    </div>
  </section>

  <section id="grid" class="grid"></section>

  <section class="panel" id="schedule"></section>
  <section class="panel" id="rules"></section>
  <section class="panel" id="sources"></section>
</main>
<footer><a href="#" data-tsrc="1" class="srcl">티어 출처·기준</a> · <a href="#" data-sysrc="1" class="srcl">사영전투 출처</a> · 팬 제작 비공식 트래커 · 보유 체크/파편 수치/저장한 덱은 이 브라우저(localStorage)에만 저장됩니다 · 모든 시각은 KST</footer>
<script src="data.js?v=202609281800"></script>
<script src="deck.js?v=202609281800"></script>
<script src="meta.js?v=202609281800"></script>
<script src="saeong.js?v=202609281800"></script>
<script src="app.js?v=202609281800"></script>
</body>
</html>
